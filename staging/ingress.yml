---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carrental-ingress
  annotations:
    cert-manager.io/cluster-issuer: http-01-staging
  
spec:
  ingressClassName: external-nginx
  rules:
    - host: staging.tiagomadeiracarrentals.com
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: carrental-internal-service
                port: 
                  number: 3000

  tls:
    - hosts:
        - staging.tiagomadeiracarrentals.com
      secretName: staging-tiagomadeiracarrentals-com

