apiVersion: apps/v1
kind: Deployment
metadata:
    name: carrental-deployment
    labels:
      app: carrental
spec:
  selector:
    matchLabels:
      app: carrental
  template:
    metadata:
      labels:
        app: carrental
    spec:
      serviceAccountName: carrental-sa
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: carrental-aws-secrets
      containers:
      - name: carrental
        image: tiagomadeiradock/railscarrentalsapi:f44f06a
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 2048Mi
            cpu: "1"
          requests:
            memory: 256Mi
            cpu: "0.2"
        ports:
          - name: http
            containerPort: 3000
        volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
        env:
          - name: RAILS_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: carrental-k8s-secret
                key: k8s-rails-master-key
          - name: DEVISE_JWT_SECRET_KEY 
            valueFrom:
              secretKeyRef:
                name: carrental-k8s-secret
                key: k8s-devise-jwt-secret-key
          - name: POSTGRES_USERNAME 
            valueFrom:
              secretKeyRef:
                name: carrental-db-k8s-secret
                key: k8s-test-user
          - name: POSTGRES_PASSWORD 
            valueFrom:
              secretKeyRef:
                name: carrental-db-k8s-secret
                key: k8s-test-pass
          - name: POSTGRES_DB_NAME
            valueFrom:
             configMapKeyRef:
                name: carrental-configmap
                key: database_name
          - name: POSTGRES_DB_HOST
            valueFrom:
             configMapKeyRef:
                name: carrental-configmap
                key: database_host
      imagePullSecrets:
      - name: regcred
      
          
                    
---
apiVersion: v1
kind: Service
metadata:
  name: carrental-internal-service
spec:
  selector:
    app: carrental
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
