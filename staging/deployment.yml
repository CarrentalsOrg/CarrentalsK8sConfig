apiVersion: apps/v1
kind: Deployment
metadata:
    name: carrental-deployment
    labels:
      app: carrental
spec:
  selector:
    matchLabels:
      app: carrental
  template:
    metadata:
      labels:
        app: carrental
    spec:
      serviceAccountName: carrental-sa
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: carrental-aws-secrets
      containers:
      - name: carrental
        image: tiagomadeiradock/railscarrentalsapi:dd8e653
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 512Mi
            cpu: "1"
          requests:
            memory: 256Mi
            cpu: "0.2"
        ports:
          - name: http
            containerPort: 3000
        volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
        env:
          - name: POSTGRES_URL
            valueFrom:
             configMapKeyRef:
                name: carrental-configmap
                key: database_url
      imagePullSecrets:
      - name: regcred
      
          
                    
---
apiVersion: v1
kind: Service
metadata:
  name: carrental-internal-service
spec:
  selector:
    app: carrental
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
